<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>컨콜봇 현황</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, "Malgun Gothic", sans-serif; background:#f5f8fc; color:#17253b }
    * { box-sizing:border-box }
    body { max-width:940px; margin:0 auto; padding:24px 16px 64px }
    header { display:flex; justify-content:space-between; align-items:start; gap:20px; margin-bottom:20px }
    h1 { font-size:1.8rem; margin:0 0 8px }
    h2 { font-size:1.12rem; margin:0 0 14px }
    p { line-height:1.5; margin:6px 0 }
    .muted { color:#52647e }
    .panel { background:white; border:1px solid #dbe4f1; border-radius:16px; padding:20px; margin:16px 0; box-shadow:0 3px 12px #17253b08 }
    .badge { display:inline-block; padding:7px 11px; border-radius:999px; font-weight:700; background:#e4eaf2; white-space:nowrap }
    .badge.live { background:#d9f5e8; color:#075a3b }
    .badge.stale { background:#fff0d0; color:#725000 }
    .summary { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px }
    .metric { background:#f4f7fb; padding:15px; border-radius:12px }
    .metric strong { display:block; font-size:1.6rem; margin-top:5px }
    table { border-collapse:collapse; width:100%; text-align:left }
    th,td { padding:9px 7px; border-bottom:1px solid #e3eaf3; overflow-wrap:anywhere }
    th { color:#52647e; font-weight:600 }
    .table-wrap { overflow-x:auto }
    .empty { padding:12px; background:#f4f7fb; border-radius:10px }
    @media(max-width:600px) { header { display:block } .badge { margin-top:12px } .panel { padding:16px } h1 { font-size:1.5rem } }
  </style>
</head>
<body>
  <header>
    <div><h1>컨콜봇 현황</h1><p class="muted">작업 요청은 기존 텔레그램 또는 집 PC 컨트롤러에서 합니다. 이 화면은 조회 전용입니다.</p></div>
    <span id="connection" class="badge" role="status">연결 확인 중</span>
  </header>
  <main>
    <section class="panel" aria-labelledby="progress-heading">
      <h2 id="progress-heading">파이프라인</h2>
      <p id="freshness" class="muted">마지막 확인 시각을 읽는 중입니다.</p>
      <div class="summary"><div class="metric">실행 중<strong id="running">—</strong></div><div class="metric">대기 중<strong id="queued">—</strong></div></div>
      <div id="jobs" class="empty" style="margin-top:14px">상태를 확인하는 중입니다.</div>
    </section>
    <section class="panel" aria-labelledby="model-heading">
      <h2 id="model-heading">새 작업에 저장된 모델 설정</h2>
      <p class="muted">이미 접수된 작업의 모델은 접수 당시 설정으로 고정됩니다. 아래 설정은 진행 중 작업의 실제 실행 모델을 뜻하지 않습니다.</p>
      <div id="models" class="empty">저장된 설정을 확인하는 중입니다.</div>
    </section>
  </main>
  <script>
    "use strict";
    const ISSUE = "https://api.github.com/repos/crhipse/concallbot-remote/issues/2";
    const STAGES = [
      ["correct", "교정"], ["verify", "검증교정"], ["summary", "요약"],
      ["inference", "추론"], ["source_note", "자료노트"], ["analysis", "기업분석"],
      ["explainer", "해설"], ["charts", "차트"]
    ];
    const el = id => document.getElementById(id);
    function reset(reason) {
      el("connection").textContent = reason;
      el("connection").className = "badge stale";
      el("running").textContent = "—";
      el("queued").textContent = "—";
      el("jobs").textContent = "현재 작업 현황을 확인할 수 없습니다.";
      el("models").textContent = "현재 저장된 모델 설정을 확인할 수 없습니다.";
    }
    function parse(body) {
      if (typeof body !== "string" || !body.startsWith("concall-relay-heartbeat:v1\n")) throw Error("marker");
      const lines = body.split("\n");
      const stamp = lines.find(x => x.startsWith("observed_at: "))?.slice(13);
      const summary = lines.find(x => x.startsWith("summary: "))?.slice(9);
      if (!stamp || !summary) throw Error("missing");
      const time = Date.parse(stamp);
      if (!Number.isFinite(time)) throw Error("timestamp");
      const value = JSON.parse(summary);
      if (value.version !== 1 || !Number.isInteger(value.running) || !Number.isInteger(value.queued) || !Array.isArray(value.jobs)) throw Error("summary");
      return {time, value};
    }
    function show(parsed) {
      const age = Date.now() - parsed.time;
      el("freshness").textContent = "집 PC 마지막 확인: " + new Date(parsed.time).toLocaleString("ko-KR");
      if (age < -60000 || age > 300000) { reset("연결 불명 · 상태 오래됨"); return; }
      el("connection").textContent = "집 PC 연결 확인";
      el("connection").className = "badge live";
      const data = parsed.value;
      el("running").textContent = String(data.running);
      el("queued").textContent = String(data.queued);
      const jobs = el("jobs");
      jobs.replaceChildren();
      if (!data.jobs.length) {
        jobs.textContent = "실행 또는 대기 중인 컨콜 작업이 없습니다.";
      } else {
        const labels = {queued:"대기",running:"실행 중",preparing:"자료 준비",waiting:"대기",high_queued:"후속 단계 대기",high_running:"후속 단계 실행 중"};
        const stages = {collecting:"원문 수집",correcting:"교정",verifying:"검증교정",summarizing:"요약"};
        for (const job of data.jobs.slice(0,30)) {
          const row = document.createElement("p");
          row.textContent = (job.ticker || "회사 확인 중") + " · " + (labels[job.state] || "상태 확인 중") + (stages[job.stage] ? " · " + stages[job.stage] : "");
          jobs.append(row);
        }
      }
      const models = el("models");
      models.replaceChildren();
      const selection = data.selection || {};
      if (selection.kind === "stage_defaults" && selection.stages) {
        const heading = document.createElement("p");
        heading.textContent = "선택된 제공자: " + (selection.provider === "claude" ? "Claude" : "ChatGPT");
        models.append(heading);
        const wrap = document.createElement("div"); wrap.className = "table-wrap";
        const table = document.createElement("table");
        const head = document.createElement("tr");
        for (const value of ["단계", "모델", "추론 강도"]) { const cell=document.createElement("th"); cell.textContent=value; head.append(cell); }
        table.append(head);
        for (const [key,label] of STAGES) {
          const choice = selection.stages[key] || {};
          const row = document.createElement("tr");
          for (const value of [label, choice.model || "확인 불가", choice.effort || "확인 불가"]) {
            const cell=document.createElement("td"); cell.textContent=value; row.append(cell);
          }
          table.append(row);
        }
        wrap.append(table); models.append(wrap);
      } else if (selection.kind === "legacy_global") {
        models.textContent = "단계별 기본값 미설정 · 현재 전역 설정: " + selection.provider + " / " + selection.model + " / " + selection.effort;
      } else {
        models.textContent = "저장된 모델 설정을 확인할 수 없습니다.";
      }
    }
    async function refresh() {
      try {
        const response = await fetch(ISSUE, {headers:{Accept:"application/vnd.github+json"},cache:"no-store"});
        if (!response.ok) throw Error("api");
        const issue = await response.json();
        if (issue.state !== "open" || issue.title !== "[cc-heartbeat:v1]") throw Error("issue");
        show(parse(issue.body));
      } catch (_) {
        reset("연결 불명 · 상태 확인 실패");
        el("freshness").textContent = "최근 확인 정보를 가져올 수 없습니다.";
      }
    }
    refresh();
    setInterval(refresh, 120000);
  </script>
</body>
</html>
